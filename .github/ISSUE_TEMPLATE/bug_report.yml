name: Bug report
about: Report a Hermes YouTube Player problem
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Check TROUBLESHOOTING.md first. If you can, enable **Debug**, reproduce the problem, then click **Copy diagnostics** and paste it below. Do not paste cookies, tokens, passwords, or private account data.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Example: v3.124. The pane title shows this as `YouTube vX.Y ★`.
      placeholder: v3.124
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes version
      placeholder: e.g. Hermes Desktop version from About/settings
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS, Ubuntu
    validations:
      required: true
  - type: dropdown
    id: signed_in
    attributes:
      label: Signed into YouTube?
      options:
        - Yes
        - No
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Docked player
        - Floating player
        - /youtube dashboard
        - Account/sign-in
        - History
        - Subscriptions
        - Watch Later
        - Shorts
        - Playlists
        - Installer/update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /youtube
        2. Click ...
        3. Expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste output from Debug → Copy diagnostics if available. Remove anything private you manually added.
      render: json
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Extra notes or screenshots
    validations:
      required: false
